# Testiasetukset: H2 muistitietokanta, ei vaadi paikallista PostgreSQL:ää.
# Tämä korvaa main-resurssien application.properties-tiedoston testien ajaksi
# (main-versiossa aktiivinen profiili on localPostgre, jonka tiedostoa ei ole repossa).
spring.application.name=ticketguru
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# schema.sql on PostgreSQL-syntaksia (BIGSERIAL), joten sitä ei ajeta H2:lla
spring.sql.init.mode=never
